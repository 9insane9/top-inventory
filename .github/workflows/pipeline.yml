name: Deployment pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Check style
        run: npm run lint

      - name: Test
        run: npm run test

  tag_release:
    if: ${{ github.event_name == 'push' && !contains(toJson(github.event.commits.*.message), '#skip')}}
    needs: [build_and_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch

  notify_success:
    needs: [build_and_test]
    if: ${{ github.event_name == 'push' && success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0x00ff00
          nodetail: true
          title: "**:white_check_mark: Pipeline successful!** Railway will deploy the new version"
          description: |
            ### Deployment Details
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.event.head_commit.author.name }}
          username: "Mr Notification Robot Person Thing"

  notify_failure:
    needs: [build_and_test]
    if: ${{ always() && failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0xff0000
          nodetail: true
          title: "**:x: Pipeline failed!** The pipeline encountered an error"
          description: |
            ### Failure Details
            **Repository:** ${{ github.repository }}
            **Target branch:** ${{ github.base_ref || github.ref_name }}
            **Source branch:** ${{ github.head_ref || github.ref_name }}
            **Commit:** ${{ github.event.pull_request.head.sha || github.sha }}
            **Message:** ${{ github.event.pull_request.title || github.event.head_commit.message }}
            **Author:** ${{ github.event.pull_request.user.login || github.event.head_commit.author.name }}
            **Workflow:** ${{ github.workflow }}
            **Build and test:** ${{ needs.build_and_test.result }}

            [View Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha || github.sha }})
            [View Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          username: "Mr Notification Robot Person Thing"
